name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      icon_only: ${{ steps.version.outputs.icon_only }}
      sha: ${{ steps.regen-icon.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags to work out the next version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Keeps icon.ico in sync whenever someone only swaps in a new Icon.png - the push then
      # touches just the two icon files, so it flows straight into the icon-only path below
      # (no version bump, the release's builds just get refreshed assets).
      - name: Regenerate icon.ico from Icon.png
        id: regen-icon
        run: |
          pip install --quiet pillow
          python scripts/generate-icon.py

          if git diff --quiet -- Assets/icon.ico; then
            echo "icon.ico already matches Icon.png"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "icon.ico is out of date but this is a PR build - not committing"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Assets/icon.ico
            git commit -m "Regenerate icon.ico from Icon.png [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
            echo "Committed regenerated icon.ico"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Next version = latest vX.Y.Z tag with the patch bumped.
      # Put [minor] or [major] in a commit message to bump those instead.
      # With no tags yet, the first release uses the <Version> in the csproj.
      # If the only files changed since that tag are the icon assets, the
      # version isn't bumped at all - the rebuilt exes just replace the
      # assets on that same release further down.
      - name: Compute version
        id: version
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          icon_only=false
          if [ -z "$last" ]; then
            next=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' FortniteAFKXPMonitor.csproj | head -n1)
          else
            changed=$(git diff --name-only "$last" HEAD)
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^Assets/(Icon\.png|icon\.ico)$'; then
              icon_only=true
              next="${last#v}"
              echo "Only icon assets changed since $last - reusing version $next"
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              msg=$(git log -1 --pretty=%B)
              if [[ "$msg" == *"[major]"* ]]; then major=$((major+1)); minor=0; patch=0
              elif [[ "$msg" == *"[minor]"* ]]; then minor=$((minor+1)); patch=0
              else patch=$((patch+1)); fi
              next="$major.$minor.$patch"
            fi
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "icon_only=$icon_only" >> "$GITHUB_OUTPUT"
          echo "Building version $next (icon_only=$icon_only)"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (self-contained single file)
        shell: bash
        run: >
          dotnet publish FortniteAFKXPMonitor.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None
          -p:Version=${{ needs.version.outputs.version }}
          -o publish

      - name: Package
        shell: bash
        run: |
          name="FortniteAFKXPMonitor-v${{ needs.version.outputs.version }}-${{ matrix.rid }}"
          mkdir -p dist
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            (cd publish && 7z a -tzip "../dist/$name.zip" FortniteAFKXPMonitor.exe)
          else
            mkdir -p "pkg/$name"
            cp publish/FortniteAFKXPMonitor "pkg/$name/"
            cp linux/99-fortnite-afk-xp.rules "pkg/$name/"
            chmod +x "pkg/$name/FortniteAFKXPMonitor"
            tar -czf "dist/$name.tar.gz" -C pkg "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*

  release:
    needs: [version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Tag & release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ needs.version.outputs.version }}"
          if [ "${{ needs.version.outputs.icon_only }}" = "true" ] && gh release view "$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Icon-only change - replacing build assets on existing release $v"
            gh release upload "$v" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$v" dist/* \
              --repo "$GITHUB_REPOSITORY" --target "${{ needs.version.outputs.sha }}" --title "$v" --generate-notes
          fi
