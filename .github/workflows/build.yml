name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags to work out the next version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Next version = latest vX.Y.Z tag with the patch bumped.
      # Put [minor] or [major] in a commit message to bump those instead.
      # With no tags yet, the first release uses the <Version> in the csproj.
      - name: Compute version
        id: version
        shell: bash
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' FortniteAFKXPMonitor.csproj | head -n1)
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            msg=$(git log -1 --pretty=%B)
            if [[ "$msg" == *"[major]"* ]]; then major=$((major+1)); minor=0; patch=0
            elif [[ "$msg" == *"[minor]"* ]]; then minor=$((minor+1)); patch=0
            else patch=$((patch+1)); fi
            next="$major.$minor.$patch"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Building version $next"

      - name: Publish (self-contained single file)
        run: >
          dotnet publish FortniteAFKXPMonitor.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/FortniteAFKXPMonitor.exe -DestinationPath FortniteAFKXPMonitor-v${{ steps.version.outputs.version }}-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FortniteAFKXPMonitor-v${{ steps.version.outputs.version }}
          path: publish/FortniteAFKXPMonitor.exe

      - name: Tag & release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.version.outputs.version }}"
          gh release create "$v" "FortniteAFKXPMonitor-$v-win-x64.zip" \
            --target "$GITHUB_SHA" --title "$v" --generate-notes
